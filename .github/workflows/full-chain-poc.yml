name: Full Chain BASH_ENV Injection
on:
  workflow_dispatch:
    inputs:
      title:
        description: 'PR/Issue title to process'
        required: true
        default: 'normal title'
permissions:
  contents: read
jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Process input and setup
        run: |
          # Simulate a real workflow that writes to a temp log file
          # AND reflects input into GITHUB_ENV
          echo 'export INJECTED_CANARY=CODE_EXEC_FROM_INPUT_INJECTION' > /tmp/process.sh
          echo "TITLE=${{ github.event.inputs.title }}" >> $GITHUB_ENV

      - uses: actions/checkout@v4

      - name: Step 3 - Check injection result
        run: |
          echo "=== INJECTION VERIFICATION ==="
          echo "TITLE=$TITLE"
          echo "BASH_ENV=$BASH_ENV"
          echo "INJECTED_CANARY=$INJECTED_CANARY"
          if [ "$INJECTED_CANARY" = "CODE_EXEC_FROM_INPUT_INJECTION" ]; then
            echo "CRITICAL: Code execution achieved via BASH_ENV input injection!"
          fi
